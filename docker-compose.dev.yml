name: ai-workflow-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP local (H1.5): captura todo email enviado pela API (reset de senha,
  # alertas de falha) sem sair pra internet. UI + API HTTP em :8025 (o E2E
  # le o email por ali); SMTP em :1025, sem auth (MailerModule usa direto).
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Opcionais (Fase 8 de observabilidade) — nao sobem com `docker compose up`
  # normal, so com `docker compose --profile observability up -d`. Fazem
  # scrape da API (:3333) e do worker (:3334) rodando LOCALMENTE (fora do
  # Docker, via `pnpm dev`/`dev:worker`) — dai o host.docker.internal.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # host.docker.internal so resolve automaticamente no Docker Desktop
      # (Mac/Windows) — no Linux precisa deste mapeamento explicito.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3005:3000"
    environment:
      # So pra uso local — nunca usar essas flags num Grafana exposto publicamente.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
